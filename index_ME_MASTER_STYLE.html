<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/png" href="me-logo.png">
<title>Miércoles Electrónicos</title>

<style>
:root{
  --bg:#050505;
  --text:#f2f2f2;
  --muted:#666;
  --line:#222;
  --green:#00ff66;
  --red:#ff1d38;
  --yellow:#ffd60a
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%
}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:monospace
}

.wrap{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:38px 20px 110px;
  position:relative
}

.brandHeader{
  display:flex;
  align-items:flex-start;
  justify-content:flex-start
}

.brandLogo{
  display:block;
  width:290px;
  max-width:100%;
  height:auto
}

.line{
  height:1px;
  background:var(--line);
  margin:30px 0
}

.rutAction{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  width:100%
}

.green{color:var(--green)}

.session{
  margin-top:14px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:1px
}

.title{
  font-size:17px;
  margin-bottom:12px
}

.prompt{
  color:var(--green)
}

.description{
  font-size:12px;
  color:#aaa;
  line-height:1.7;
  margin:10px 0
}

.welcomeText{
  max-width:100%
}

label{
  display:block;
  margin:20px 0 8px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:1.5px
}

input,select{
  width:100%;
  padding:15px;
  background:#000;
  color:#fff;
  border:1px solid #292929;
  font:inherit
}

input:focus,select:focus{
  outline:none;
  border-color:var(--green)
}

#rutInput{
  width:290px;
  max-width:100%;
  display:block
}

#go{
  width:290px;
  max-width:100%;
  display:block;
  margin-top:14px;
  background:#ff1d38;
  color:#fff
}

button{
  width:100%;
  margin-top:18px;
  padding:16px;
  background:#ff1d38;
  color:#fff;
  border:0;
  font:inherit;
  font-weight:700;
  cursor:pointer
}

button.secondary{
  background:#000;
  color:#fff;
  border:1px solid #fff
}

.status{
  margin:20px 0;
  padding:16px;
  border-left:2px solid var(--green);
  background:#080d09;
  font-size:12px;
  line-height:1.7
}

.error{
  border-left-color:var(--red);
  background:#0d0707
}

.footer{
  margin-top:45px;
  color:#444;
  font-size:9px;
  line-height:1.8
}

@media (pointer:coarse){
  .wrap{
    width:90vw;
    max-width:720px;
    margin:0 auto;
    padding:24px 0 105px
  }

  .brandHeader{
    width:100%;
    max-width:none
  }

  .brandLogo{
    width:min(100%,340px);
    max-width:100%;
    height:auto
  }

  .session{
    font-size:12px;
    max-width:100%
  }

  .title{
    font-size:21px;
    max-width:100%;
    line-height:1.25
  }

  .description{
    font-size:16px;
    max-width:100%;
    line-height:1.6
  }

  label{
    font-size:11px;
    margin-top:20px
  }

  input,select{
    width:100%;
    min-height:54px;
    padding:15px;
    font-size:17px
  }

  #rutInput{
    width:100%;
    max-width:none;
    display:block
  }

  #go{
    width:100%;
    max-width:none;
    display:block;
    margin-top:14px;
    background:#ff1d38;
    color:#fff
  }

  button{
    width:100%;
    min-height:54px;
    padding:15px;
    font-size:15px
  }
}
</style>
</head>

<body>
<div class="wrap">

  <div class="brandHeader">
    <img class="brandLogo" src="me-logo.png" alt="Miércoles Electrónicos">
  </div>

  <div class="session">SESSION_071 // UMHO_MOONWALKER</div>

  <div class="line"></div>

  <div id="app"></div>

  <div class="footer">
    COMMUNITY SYSTEM // 2026<br>
    SESSION_071 // ACCESS CONTROL
  </div>

</div>

<script>
function home(){
  document.getElementById('app').innerHTML =
    '<div class="title"><span class="prompt">></span> COMMUNITY ACCESS</div>'+
    '<div class="description welcomeText">Tu recarga de buena música a media semana comienza aquí!<br><br>Ingresa tu RUT para continuar:</div>'+
    '<label>RUT</label>'+
    '<div class="rutAction">'+
      '<input id="rutInput" type="text" placeholder="17893792-5" autocomplete="off">'+
      '<button id="go">ENTRARA A LA SESIÓN</button>'+
    '</div>';

  document.getElementById('go').onclick = function(){
    const rut = document.getElementById('rutInput').value.trim();

    if(!rut){
      document.getElementById('app').innerHTML +=
        '<div class="status error">DEBES INGRESAR TU RUT.</div>';
      return;
    }

    document.getElementById('app').innerHTML =
      '<div class="title"><span class="prompt">></span> TEST ACCESS</div>'+
      '<div class="status">'+
        'INTERFAZ EXTERNA FUNCIONANDO.<br><br>'+
        'RUT INGRESADO: '+esc(rut)+
      '</div>'+
      '<button class="secondary" onclick="home()">BACK</button>';
  };

  document.getElementById('rutInput').addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      document.getElementById('go').click();
    }
  });
}

function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

home();
</script>
</body>
</html>
