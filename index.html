<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/png" href="me-logo.png">
<style>
:root{--bg:#050505;--text:#f2f2f2;--muted:#666;--line:#222;--green:#00ff66;--red:#ff1d38;--yellow:#ffd60a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:monospace}
body{padding:0 20px}
.wrap{max-width:720px;margin:auto;padding:38px 0 110px;position:relative}
.brandLogo{display:block;width:290px;max-width:100%;height:auto}
.session{margin-top:14px;color:var(--muted);font-size:10px;letter-spacing:1px}
.line{height:1px;background:var(--line);margin:30px 0}
.title{font-size:17px;margin-bottom:12px}
.prompt{color:var(--green)}
.description{font-size:12px;color:#aaa;line-height:1.7;margin:10px 0}
label{display:block;margin:20px 0 8px;color:var(--muted);font-size:10px;letter-spacing:1.5px}
input,select{width:100%;padding:15px;background:#000;color:#fff;border:1px solid #292929;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--green)}
button{width:100%;margin-top:18px;padding:16px;background:var(--red);color:#fff;border:0;font:inherit;font-weight:700;cursor:pointer}
button.secondary{background:#000;color:#fff;border:1px solid #fff}
.status{margin:20px 0;padding:16px;border-left:2px solid var(--green);background:#080d09;font-size:12px;line-height:1.7}
.error{border-left-color:var(--red);background:#0d0707}
.warning{border-left-color:var(--yellow);background:#0d0c07}
.tramos{border:1px solid var(--line);margin:20px 0}
.tramo{display:flex;justify-content:space-between;gap:15px;padding:12px;border-bottom:1px solid #161616;font-size:11px}
.tramo:last-child{border:0}
.footer{margin-top:45px;color:#444;font-size:9px;line-height:1.8}
.refbox{margin-top:18px}
@media(pointer:coarse){
  body{padding:0 14px}
  .wrap{width:90vw;padding:24px 0 105px}
  .brandLogo{width:min(100%,340px)}
  .session{font-size:12px}
  .title{font-size:21px;line-height:1.25}
  .description{font-size:16px;line-height:1.6}
  label{font-size:11px}
  input,select{min-height:54px;padding:15px;font-size:17px}
  button{min-height:54px;font-size:15px}
  .tramo{font-size:13px;padding:14px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <img class="brandLogo" src="me-logo.png" alt="Miércoles Electrónicos">
  <div class="session">SESSION_071 // UMHO_MOONWALKER</div>
  <div class="line"></div>
  <div id="app"></div>
  <div class="footer">COMMUNITY SYSTEM // 2026<br>SESSION_071 // ACCESS CONTROL</div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxqR-Qd4-Ed4M-JgKXLsHpaLrKEvvTFmGTVIyTy5hctLos-tXjn5XX-zdc10ck9-QEm/exec';
let currentRut = '';
let currentEmail = '';
let currentData = null;

function esc(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function setApp(html){ document.getElementById('app').innerHTML=html; }

function error(msg){
  setApp(
    '<div class="title"><span class="prompt">></span> ERROR</div>'+
    '<div class="status error">'+esc(msg)+'</div>'+
    '<button class="secondary" onclick="home()">BACK</button>'
  );
}

function loading(title,sub){
  setApp(
    '<div class="title"><span class="prompt">></span> '+esc(title)+'</div>'+
    '<div class="status">'+esc(sub)+'</div>'
  );
}

function jsonp(action, params, done){
  const callback='me_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  const script=document.createElement('script');

  window[callback]=function(res){
    delete window[callback];
    if(script.parentNode) script.parentNode.removeChild(script);
    done(res);
  };

  const q=new URLSearchParams();
  q.set('api','1');
  q.set('action',action);
  q.set('callback',callback);

  Object.keys(params||{}).forEach(function(k){
    q.set(k, params[k]==null?'':String(params[k]));
  });

  script.onerror=function(){
    delete window[callback];
    if(script.parentNode) script.parentNode.removeChild(script);
    done({ok:false,mensaje:'ERROR DE CONEXIÓN CON EL SERVIDOR.'});
  };

  script.src=API_URL+'?'+q.toString();
  document.body.appendChild(script);
}

function home(){
  setApp(
    '<div class="title"><span class="prompt">></span> COMMUNITY ACCESS</div>'+
    '<div class="description">Tu recarga de buena música a media semana comienza aquí!<br><br>Ingresa tu RUT para continuar:</div>'+
    '<label>RUT</label>'+
    '<input id="rutInput" type="text" placeholder="15.383.513-6" autocomplete="off">'+
    '<button id="go">ENTRAR A LA SESIÓN</button>'
  );

  document.getElementById('go').onclick=consult;
  document.getElementById('rutInput').addEventListener('keydown',function(e){
    if(e.key==='Enter') consult();
  });
}

function consult(){
  const rut=(document.getElementById('rutInput').value||'').trim();
  if(!rut)return error('DEBES INGRESAR TU RUT.');

  loading('SEARCHING...','CHECKING COMMUNITY HISTORY...');

  jsonp('consultarrut',{rut:rut},function(res){
    if(!res||!res.ok){
      error(res&&res.mensaje?res.mensaje:'NO SE PUDO CONSULTAR EL RUT.');
      return;
    }

    currentRut=res.rut||rut;
    currentEmail=res.email||'';
    currentData=res;

    renderPersona(res);
  });
}

function renderConditions(list){
  const rows=Array.isArray(list)?list:[];
  if(!rows.length)return '<div class="status warning">NO HAY CONDICIONES CONFIGURADAS.</div>';

  return '<div class="tramos">'+rows.map(function(t){
    const value=Number(t.valor||0);
    return '<div class="tramo"><span>'+esc(t.desde)+' — '+esc(t.hasta)+'</span><strong>'+
      (value===0?'GRATIS':'$'+value.toLocaleString('es-CL'))+
      '</strong></div>';
  }).join('')+'</div>';
}

function referencesBlock(res,action){
  const refs=Array.isArray(res.referencias)?res.referencias:[];
  return '<div class="refbox">'+
    '<label>A QUIÉN VIENES A ESCUCHAR PRINCIPALMENTE O POR QUIÉN FUISTE INVITADO</label>'+
    '<select id="ref"><option value="">SELECCIONA UNA OPCIÓN</option>'+
      refs.map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+'</option>';}).join('')+
    '</select>'+
    '<div id="otroBox"></div>'+
    '<button id="actionBtn">'+(action==='reserve'?'FINALIZAR MI CHECKIN':'CONFIRMAR SOLICITUD')+'</button>'+
  '</div>';
}

function bindReferences(res,action){
  const ref=document.getElementById('ref');
  const otherBox=document.getElementById('otroBox');
  const btn=document.getElementById('actionBtn');
  if(!ref||!btn)return;

  btn.disabled=true;

  ref.onchange=function(){
    btn.disabled=!ref.value;
    otherBox.innerHTML=ref.value==='OTRO'
      ? '<label>¿QUIÉN?</label><input id="otro" placeholder="Escribe el nombre">'
      : '';
  };

  btn.onclick=function(){
    const value=ref.value;
    const other=document.getElementById('otro')?document.getElementById('otro').value.trim():'';

    if(!value)return error('DEBES SELECCIONAR UNA REFERENCIA.');
    if(value==='OTRO'&&!other)return error('DEBES INDICAR QUIÉN.');

    btn.disabled=true;
    btn.textContent='GUARDANDO...';

    if(action==='reserve'){
      jsonp('crearreserva',{
        rut:currentRut,
        email:currentEmail,
        referencia:value,
        referenciaOtro:other
      },function(r){
        if(!r||!r.ok){
          error(r&&r.mensaje?r.mensaje:'NO SE PUDO CREAR LA RESERVA.');
          return;
        }

        setApp(
          '<div class="title"><span class="prompt">></span> ACCESS CONFIRMED</div>'+
          '<div class="description"><strong>'+esc((currentData.nombre||'')+' '+(currentData.apellido||''))+'</strong></div>'+
          '<div class="description">ESTADO: <strong>MIEMBRO</strong></div>'+
          '<div class="status">TU CHECKIN PARA LA SESIÓN 71 · UMHO MOONWALKER YA ESTÁ CONFIRMADO.</div>'+
          '<div class="description"><strong>Para validar tu ingreso en la sesión solo necesitas presentar tu carnet de identidad.</strong></div>'+
          '<div class="description">Con tu RUT puedes consultar siempre el estado de tu CHECKIN en <strong>acceso.miercoleselectronicos.com</strong>.</div>'+
          '<button class="secondary" onclick="home()">BACK</button>'
        );
      });
      return;
    }

    const data={
      documento:currentRut,
      email:currentEmail||currentData.email||'',
      nombre:currentData.nombre||'',
      apellido:currentData.apellido||'',
      fechaNacimiento:currentData.fechaNacimiento||'',
      sexo:currentData.sexo||'',
      instagram:currentData.instagram||'',
      telefono:currentData.telefono||''
    };

    jsonp('solicitaraccesonuevo',{
      datos:JSON.stringify(data),
      referencia:value,
      referenciaOtro:other
    },function(r){
      if(!r||!r.ok){
        error(r&&r.mensaje?r.mensaje:'NO SE PUDO REGISTRAR LA SOLICITUD.');
        return;
      }

      setApp(
        '<div class="title"><span class="prompt">></span> REQUEST RECEIVED</div>'+
        '<div class="status">¡Tu solicitud fue enviada correctamente!</div>'+
        '<div class="description">La respuesta será enviada a tu correo electrónico o puedes consultar en esta misma plataforma usando tu RUT.</div>'+
        '<button class="secondary" onclick="home()">BACK</button>'
      );
    });
  };
}

function renderPersona(res){
  if(res.listaNegra){
    return error('TU SOLICITUD NO PUEDE CONTINUAR.');
  }

  if(res.reservaActual){
    setApp(
      '<div class="title"><span class="prompt">></span> ACCESS CONFIRMED</div>'+
      '<div class="description"><strong>'+esc((res.nombre||'')+' '+(res.apellido||''))+'</strong></div>'+
      (res.validadoAnteriormente?'<div class="description">ESTADO: <strong>MIEMBRO</strong></div>':'')+
      '<div class="status">TU CHECKIN PARA LA SESIÓN 71 · UMHO MOONWALKER YA ESTÁ CONFIRMADO.</div>'+
      renderConditions(res.condiciones)+
      '<div class="description"><strong>Para validar tu ingreso en la sesión solo necesitas presentar tu carnet de identidad.</strong></div>'+
      '<div class="description">Con tu RUT puedes consultar siempre el estado de tu CHECKIN en <strong>acceso.miercoleselectronicos.com</strong>.</div>'+
      '<button class="secondary" onclick="home()">BACK</button>'
    );
    return;
  }

  // Miembro validado anteriormente: CHECKIN automático.
  if(res.validadoAnteriormente){
    setApp(
      '<div class="title"><span class="prompt">></span> CHECKIN</div>'+
      '<div class="description"><strong>'+esc((res.nombre||'')+' '+(res.apellido||''))+'</strong></div>'+
      '<div class="description">ESTADO: <strong>MIEMBRO</strong></div>'+
      '<div class="status">TU CHECKIN PARA LA SESIÓN 71 ESTÁ LISTO.</div>'+
      referencesBlock(res,'reserve')
    );
    bindReferences(res,'reserve');
    return;
  }

  // Persona existente en COMUNIDAD pero sin validación anterior:
  // debe poder generar una solicitud.
  if(res.existe){
    setApp(
      '<div class="title"><span class="prompt">></span> REQUEST READY</div>'+
      '<div class="description"><strong>'+esc((res.nombre||'')+' '+(res.apellido||''))+'</strong></div>'+
      '<div class="description">TU FICHA YA ESTÁ REGISTRADA EN NUESTRA COMUNIDAD.</div>'+
      '<div class="description">NO TIENES UNA SOLICITUD PARA ESTA SESIÓN.</div>'+
      referencesBlock(res,'newRequest')
    );
    bindReferences(res,'newRequest');
    return;
  }

  // Nuevo RUT: keep the existing verified-email flow.
  renderNewUserEmail_(res.rut,res.referencias||[]);
}

function renderNewUserEmail_(rut,refs){
  currentRut=rut;

  setApp(
    '<div class="title"><span class="prompt">></span> VERIFY EMAIL</div>'+
    '<div class="description">Gracias! Ahora por favor ingresa tu correo electrónico</div>'+
    '<label>EMAIL</label>'+
    '<input id="newEmail" type="email" placeholder="tu@email.com" autocomplete="email">'+
    '<div id="verifyMsg"></div>'+
    '<button id="sendEmailBtn">ENVIAR CÓDIGO</button>'+
    '<button class="secondary" onclick="home()">BACK</button>'
  );

  document.getElementById('sendEmailBtn').onclick=function(){
    const email=(document.getElementById('newEmail').value||'').trim().toLowerCase();
    if(!email||email.indexOf('@')<1){
      document.getElementById('verifyMsg').innerHTML='<div class="status error">DEBES INGRESAR UN CORREO VÁLIDO.</div>';
      return;
    }

    const btn=this;
    btn.disabled=true;
    btn.textContent='CONSULTANDO...';

    jsonp('consultaremail',{email:email},function(member){
      if(!member||!member.ok){
        btn.disabled=false;btn.textContent='ENVIAR CÓDIGO';
        document.getElementById('verifyMsg').innerHTML='<div class="status error">'+esc(member&&member.mensaje?member.mensaje:'NO SE PUDO CONSULTAR LA COMUNIDAD.')+'</div>';
        return;
      }

      if(member.existe&&member.tieneRut){
        btn.disabled=false;btn.textContent='ENVIAR CÓDIGO';
        document.getElementById('verifyMsg').innerHTML='<div class="status error">ESTE CORREO YA ESTÁ ASOCIADO A OTRO RUT.</div>';
        return;
      }

      jsonp('consultarcorreoantesdeverificar',{email:email,rutActual:currentRut},function(req){
        if(!req||!req.ok){
          btn.disabled=false;btn.textContent='ENVIAR CÓDIGO';
          document.getElementById('verifyMsg').innerHTML='<div class="status error">'+esc(req&&req.mensaje?req.mensaje:'NO SE PUDO CONSULTAR LA SOLICITUD.')+'</div>';
          return;
        }

        if(req.solicitudExiste){
          setApp(
            '<div class="title"><span class="prompt">></span> REQUEST STATUS</div>'+
            '<div class="status">TU SOLICITUD PARA LA SESIÓN 71 YA FUE RECIBIDA.</div>'+
            '<button class="secondary" onclick="home()">BACK</button>'
          );
          return;
        }

        currentEmail=email;

        jsonp('enviarcodigo',{email:email},function(sent){
          if(!sent||!sent.ok){
            btn.disabled=false;btn.textContent='ENVIAR CÓDIGO';
            document.getElementById('verifyMsg').innerHTML='<div class="status error">'+esc(sent&&sent.mensaje?sent.mensaje:'NO SE PUDO ENVIAR EL CÓDIGO.')+'</div>';
            return;
          }

          renderEmailCode_(email,refs);
        });
      });
    });
  };
}

function renderEmailCode_(email,refs){
  setApp(
    '<div class="title"><span class="prompt">></span> VERIFY EMAIL</div>'+
    '<div class="description">Enviamos un código a <strong>'+esc(email)+'</strong>.</div>'+
    '<label>CÓDIGO DE VERIFICACIÓN</label>'+
    '<input id="emailCode" inputmode="numeric" autocomplete="one-time-code">'+
    '<div id="codeMsg"></div>'+
    '<button id="verifyBtn">VERIFICAR</button>'+
    '<button class="secondary" onclick="home()">BACK</button>'
  );

  document.getElementById('verifyBtn').onclick=function(){
    const code=(document.getElementById('emailCode').value||'').trim();
    const btn=this;
    if(!code)return;

    btn.disabled=true;
    btn.textContent='VALIDANDO...';

    jsonp('verificarcodigo',{email:email,codigo:code},function(valid){
      if(!valid||!valid.ok){
        btn.disabled=false;btn.textContent='VERIFICAR';
        document.getElementById('codeMsg').innerHTML='<div class="status error">'+esc(valid&&valid.mensaje?valid.mensaje:'CÓDIGO INCORRECTO O EXPIRADO.')+'</div>';
        return;
      }

      renderNewProfile_(email,refs);
    });
  };
}

function renderNewProfile_(email,refs){
  setApp(
    '<div class="title"><span class="prompt">></span> COMPLETE PROFILE</div>'+
    '<div class="description">Completa tus datos para continuar.</div>'+
    '<label>NOMBRE</label><input id="nombre">'+
    '<label>APELLIDO</label><input id="apellido">'+
    '<label>FECHA DE NACIMIENTO</label><input id="fechaNacimiento" type="date">'+
    '<label>SEXO</label><select id="sexo"><option value="">SELECCIONA</option><option value="M">M</option><option value="F">F</option><option value="OTRO">OTRO</option></select>'+
    '<label>INSTAGRAM</label><input id="instagram" placeholder="@usuario">'+
    '<label>TELÉFONO</label><input id="telefono" placeholder="+569...">'+
    '<button id="profileBtn">CONTINUAR</button>'+
    '<div id="profileMsg"></div>'
  );

  document.getElementById('profileBtn').onclick=function(){
    const datos={
      documento:currentRut,
      email:email,
      nombre:document.getElementById('nombre').value.trim(),
      apellido:document.getElementById('apellido').value.trim(),
      fechaNacimiento:document.getElementById('fechaNacimiento').value,
      sexo:document.getElementById('sexo').value,
      instagram:document.getElementById('instagram').value.trim(),
      telefono:document.getElementById('telefono').value.trim()
    };

    const btn=this;
    btn.disabled=true;
    btn.textContent='GUARDANDO...';

    jsonp('savenewprofile',{datos:JSON.stringify(datos)},function(saved){
      if(!saved||!saved.ok){
        btn.disabled=false;btn.textContent='CONTINUAR';
        document.getElementById('profileMsg').innerHTML='<div class="status error">'+esc(saved&&saved.mensaje?saved.mensaje:'NO SE PUDO GUARDAR LA FICHA.')+'</div>';
        return;
      }

      currentEmail=email;
      currentData=Object.assign({},saved,{rut:currentRut,email:email,nombre:datos.nombre,apellido:datos.apellido,fechaNacimiento:datos.fechaNacimiento,sexo:datos.sexo,instagram:datos.instagram,telefono:datos.telefono,referencias:saved.referencias||refs,condiciones:saved.condiciones||[]});

      if(saved.aprobadoAutomaticamente){
        setApp(
          '<div class="title"><span class="prompt">></span> CHECKIN</div>'+
          '<div class="status">TU CHECKIN PARA LA SESIÓN 71 ESTÁ LISTO.</div>'+
          referencesBlock(currentData,'reserve')
        );
        bindReferences(currentData,'reserve');
      }else{
        setApp(
          '<div class="title"><span class="prompt">></span> REQUEST READY</div>'+
          '<div class="description">Tu ficha quedó registrada. Completa este último paso para enviar tu solicitud.</div>'+
          referencesBlock(currentData,'newRequest')
        );
        bindReferences(currentData,'newRequest');
      }
    });
  };
}

home();
</script>
</body>
</html>
