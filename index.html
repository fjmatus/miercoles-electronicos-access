<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GURHUB · Community Access</title>
<style>
:root{--bg:#050505;--text:#f2f2f2;--muted:#777;--line:#222;--red:#ff3b30;--green:#45d483;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:42px 22px 60px}
.title{font-size:24px;font-weight:700;letter-spacing:.02em;margin-bottom:18px}
.prompt{color:var(--red)}
.description,.status{color:#aaa;line-height:1.55;font-size:15px}
.status.error{color:var(--red)}
input,button{font:inherit}
input{width:100%;padding:15px 14px;background:#0b0b0b;border:1px solid var(--line);color:#fff;border-radius:8px;outline:none}
input:focus{border-color:#555}
button{border:0;border-radius:8px;padding:14px 18px;margin-top:14px;cursor:pointer}
.primary{background:#fff;color:#000}
.secondary{background:#171717;color:#fff;border:1px solid #2b2b2b}
.row{display:flex;gap:10px;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}
.option{display:block;width:100%;text-align:left;background:#0c0c0c;color:#fff;border:1px solid #242424}
.small{font-size:13px;color:#777}
.searchingTitle .dots::after{content:"...";animation:dots 1.2s infinite}
@keyframes dots{0%{content:"."}33%{content:".."}66%,100%{content:"..."}}
</style>
</head>
<body>
<main id="app"></main>

<script>
/*
 GURHUB GitHub frontend
 Baseline: Session 73
 FETCH V3:
 - Uses fetch() instead of JSONP.
 - No backend logic changes.
 - Logs request start/end, elapsed time and active requests.
 - Prevents duplicate clicks while a request is pending.
 - Parses the existing JSONP-shaped backend response without executing it.
*/

const API_URL = 'https://script.google.com/macros/s/AKfycby2Fv8OwTARjkY3S1WVxgyNzqxny24qufWQkymsJ1AAptfY_EFpwaRtNnmeX3l5_EkMww/exec';
const SESSION = 73;

let currentRut = '';
let currentEmail = '';
let currentData = null;
let activeApiRequests = 0;
let consultInProgress = false;
let requestSequence = 0;

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function money(v) {
  const n = Number(v || 0);
  return n === 0 ? 'GRATIS' : '$' + n.toLocaleString('es-CL');
}

function setApp(html) {
  document.getElementById('app').innerHTML = html;
}

function loading(title, sub) {
  const animated = title === 'SEARCHING...';
  setApp(
    '<div class="title"><span class="prompt">&gt;</span> '+
    (animated
      ? '<span class="searchingTitle">SEARCHING<span class="dots"></span></span>'
      : esc(title))+
    '</div>'+
    '<div class="status">'+esc(sub)+'</div>'
  );
}

function error(msg) {
  setApp(
    '<div class="title"><span class="prompt">&gt;</span> CONEXIÓN TEMPORALMENTE NO DISPONIBLE</div>'+
    '<div class="status error">'+esc(msg)+'</div>'+
    '<button class="secondary" onclick="home()">BACK</button>'
  );
}

async function apiCall(fn, args, done) {
  const requestId = ++requestSequence;
  const startedAt = performance.now();

  activeApiRequests++;

  console.log(
    'GURHUB GITHUB DIAG | REQUEST START | id=' + requestId +
    ' | fn=' + fn +
    ' | active=' + activeApiRequests +
    ' | t=' + Math.round(startedAt)
  );

  const params = new URLSearchParams();
  params.set('api','1');
  params.set('fn',fn);
  params.set('args',JSON.stringify(args || []));

  const url = API_URL + '?' + params.toString();

  console.log(
    'GURHUB GITHUB DIAG | FETCH START | id=' + requestId +
    ' | fn=' + fn
  );

  try {
    const response = await fetch(url, {
      method: 'GET',
      mode: 'cors',
      cache: 'no-store'
    });

    const texto = await response.text();

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    let result;

    /*
     The current backend returns JSONP-shaped text:
       callbackName({...});
     For fetch() we remove only that wrapper and parse the JSON.
    */
    const match = texto.match(/^[^(]*\(([\s\S]*)\);?\s*$/);

    if (!match) {
      throw new Error('Respuesta del servidor no válida.');
    }

    try {
      result = JSON.parse(match[1]);
    } catch (parseError) {
      throw new Error('No pudimos interpretar la respuesta del servidor.');
    }

    const elapsed = Math.round(performance.now() - startedAt);
    activeApiRequests--;

    console.log(
      'GURHUB GITHUB DIAG | REQUEST END | id=' + requestId +
      ' | fn=' + fn +
      ' | type=FETCH' +
      ' | http=' + response.status +
      ' | elapsed=' + elapsed + ' ms' +
      ' | active=' + activeApiRequests
    );

    done(null, result);

  } catch (error) {
    const elapsed = Math.round(performance.now() - startedAt);
    activeApiRequests--;

    console.error(
      'GURHUB GITHUB DIAG | REQUEST ERROR | id=' + requestId +
      ' | fn=' + fn +
      ' | elapsed=' + elapsed + ' ms' +
      ' | active=' + activeApiRequests,
      error
    );

    done(error, null);
  }
}

function home() {
  consultInProgress = false;

  setApp(
    '<div class="title"><span class="prompt">&gt;</span> COMMUNITY ACCESS</div>'+
    '<div class="description">Tu recarga de buena música a media semana comienza aquí!<br><br>Ingresa tu RUT para continuar:</div>'+
    '<div class="card">'+
      '<input id="rut" autocomplete="off" inputmode="text" placeholder="12.345.678-9">'+
      '<button class="primary" onclick="consult()">CONTINUAR</button>'+
    '</div>'
  );

  const input=document.getElementById('rut');
  if(input) {
    input.focus();
    input.addEventListener('keydown',e=>{if(e.key==='Enter') consult();});
  }
}

function consult() {
  if (consultInProgress) {
    console.log('GURHUB GITHUB DIAG | CONSULT BLOCKED | duplicate request prevented');
    return;
  }

  const input=document.getElementById('rut');
  const value=(input?.value || '').trim();

  if(!value) {
    error('DEBES INGRESAR TU RUT.');
    return;
  }

  consultInProgress = true;
  currentRut=value;

  console.log(
    'GURHUB GITHUB DIAG | CONSULT START | rut=' + value +
    ' | active=' + activeApiRequests
  );

  loading('SEARCHING...','CHECKING COMMUNITY HISTORY...');

  apiCall('consultarRut',[value],function(err,res) {
    consultInProgress = false;

    console.log(
      'GURHUB GITHUB DIAG | CONSULT CALLBACK | rut=' + value +
      ' | ok=' + (!!res && !!res.ok) +
      ' | active=' + activeApiRequests
    );

    if(err) {
      error(err.message);
      return;
    }

    if(!res || !res.ok) {
      error((res && (res.mensaje || res.message)) || 'No pudimos completar la consulta.');
      return;
    }

    currentData=res;

    if(res.validadoAnteriormente) {
      renderExisting(res);
      return;
    }

    if(res.solicitudExiste) {
      renderExisting(res);
      return;
    }

    if(!res.existe) {
      renderNew(res);
      return;
    }

    renderExisting(res);
  });
}

function renderExisting(res) {
  const name = [res.nombre,res.apellido].filter(Boolean).join(' ');
  setApp(
    '<div class="title"><span class="prompt">&gt;</span> WELCOME BACK</div>'+
    '<div class="description">'+
      (name ? 'Hola <b>'+esc(name)+'</b>.<br><br>' : '')+
      'Tu información fue encontrada en la comunidad.'+
    '</div>'+
    '<div class="card">'+
      '<div class="small">ESTADO</div><div>'+esc(res.estado || '')+'</div>'+
      (res.condicion ? '<br><div class="small">CONDICIÓN</div><div>'+esc(res.condicion)+'</div>' : '')+
      (res.solicitudEstado ? '<br><div class="small">SOLICITUD</div><div>'+esc(res.solicitudEstado)+'</div>' : '')+
      (res.reservaActual ? '<br><div class="small">RESERVA</div><div>CONFIRMADA</div>' : '')+
    '</div>'+
    '<button class="secondary" onclick="home()">BACK</button>'
  );
}

function renderNew(res) {
  setApp(
    '<div class="title"><span class="prompt">&gt;</span> NEW ASSISTANT</div>'+
    '<div class="description">No encontramos tu RUT en la comunidad.<br><br>Para continuar necesitamos registrar tus datos.</div>'+
    '<div class="card">'+
      '<input id="email" type="email" autocomplete="email" placeholder="Tu correo electrónico">'+
      '<button class="primary" onclick="sendEmail()">CONTINUAR</button>'+
    '</div>'+
    '<button class="secondary" onclick="home()">BACK</button>'
  );
}

function sendEmail() {
  const email=(document.getElementById('email')?.value || '').trim().toLowerCase();
  if(!email || !email.includes('@')) {
    error('DEBES INGRESAR UN CORREO ELECTRÓNICO VÁLIDO.');
    return;
  }
  currentEmail=email;
  loading('VERIFYING...','CHECKING EMAIL...');
  apiCall('consultarEmail',[email],function(err,res) {
    if(err) { error(err.message); return; }
    if(!res || !res.ok) {
      error((res && res.mensaje) || 'No pudimos consultar el correo.');
      return;
    }
    if(typeof enviarCodigo === 'function') {
      enviarCodigo(email);
    } else {
      renderVerifyCode();
    }
  });
}

function renderVerifyCode() {
  setApp(
    '<div class="title"><span class="prompt">&gt;</span> VERIFY EMAIL</div>'+
    '<div class="description">Ingresa el código que enviamos a <b>'+esc(currentEmail)+'</b>.</div>'+
    '<div class="card">'+
      '<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Código">'+
      '<button class="primary" onclick="verifyCode()">VERIFICAR</button>'+
    '</div>'+
    '<button class="secondary" onclick="home()">BACK</button>'
  );
}

function verifyCode() {
  const code=(document.getElementById('code')?.value || '').trim();
  if(!code) {
    error('DEBES INGRESAR EL CÓDIGO.');
    return;
  }
  loading('VERIFYING...','CHECKING CODE...');
  apiCall('verificarCodigo',[currentEmail,code],function(err,res) {
    if(err) { error(err.message); return; }
    if(!res || !res.ok) {
      error((res && res.mensaje) || 'El código no pudo ser verificado.');
      return;
    }
    renderReference(res);
  });
}

function renderReference(res) {
  const refs=Array.isArray(res.referencias) ? res.referencias : [];
  let html =
    '<div class="title"><span class="prompt">&gt;</span> REFERENCE</div>'+
    '<div class="description">¿Quién te trae a esta sesión?</div>'+
    '<div class="card">';

  refs.forEach(function(ref) {
    html += '<button class="option" onclick="selectReference(\''+
      esc(ref).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+
      '\')">'+esc(ref)+'</button>';
  });

  html += '<button class="secondary" onclick="home()">BACK</button></div>';
  setApp(html);
}

function selectReference(ref) {
  loading('PROCESSING...','CREATING YOUR ACCESS...');
  apiCall('solicitarAccesoNuevo',[currentRut,currentEmail,ref,''],function(err,res) {
    if(err) { error(err.message); return; }
    if(!res || !res.ok) {
      error((res && res.mensaje) || 'No pudimos crear tu solicitud.');
      return;
    }
    renderSuccess(res);
  });
}

function renderSuccess(res) {
  setApp(
    '<div class="title"><span class="prompt">&gt;</span> DONE</div>'+
    '<div class="description">'+
      esc(res.mensaje || 'Tu solicitud fue registrada correctamente.')+
    '</div>'+
    '<button class="secondary" onclick="home()">BACK</button>'
  );
}

home();
</script>
</body>
</html>
