<script>

'use strict';

const API_URL='https://script.google.com/macros/s/AKfycby2Fv8OwTARjkY3S1WVxgyNzqxny24qufWQkymsJ1AAptfY_EFpwaRtNnmeX3l5_EkMww/exec';

const SESSION=75;

const API_TIMEOUT_MS=60000;

const WAIT_ROTATE_MS=1200;
const WAIT_LONG_MS=8000;

let currentRut='';

let currentEmail='';

let currentData=null;

let requestSeq=0;

let actionBusy=false;

function esc(v){

  return String(v==null?'':v)

    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');

}

function money(v){

  const n=Number(v||0);

  return n===0?'GRATIS':'$'+n.toLocaleString('es-CL');

}

function validRutFront_(value){

  const clean=String(value==null?'':value)

    .toUpperCase()

    .replace(/[.\-\s']/g,'');

  if(!/^\d+[0-9K]$/.test(clean))return false;

  const body=clean.slice(0,-1);

  const dv=clean.slice(-1);

  if(!/^\d{7,8}$/.test(body))return false;

  let sum=0;

  let mult=2;

  for(let i=body.length-1;i>=0;i--){

    sum+=Number(body.charAt(i))*mult;

    mult=mult===7?2:mult+1;

  }

  const result=11-(sum%11);

  const expected=result===11?'0':result===10?'K':String(result);

  return dv===expected;

}

function showRutValidationError(){

  actionBusy=false;

  setApp(

    '<div class="title"><span class="prompt">&gt;</span> RUT NO VÁLIDO</div>'+

    '<div class="status error">EL RUT INGRESADO NO ES VÁLIDO.</div>'+

    '<button class="secondary" id="backBtn">BACK</button>'

  );

  const back=document.getElementById('backBtn');

  if(back)back.onclick=home;

}

function setApp(html){document.getElementById('app').innerHTML=html;}

function lockBackButton_(){
  const back=document.getElementById('backBtn');
  if(back)back.disabled=true;
}

function waitMarkup(message,elapsed){

  const secs=Math.max(0,Math.floor(elapsed||0));

  return '<div class="waitLine"><strong>'+esc(message)+'</strong><span class="processingDots"></span></div>'+
    '<div class="waitElapsed">'+(secs<2?'Conectando con la comunidad...':secs<8?'Consultando la base de datos...':'Seguimos trabajando · '+secs+' s')+'</div>'+
    '<div class="actionProgress"><span class="liveDot"></span><strong>SISTEMA ACTIVO</strong> · tu solicitud sigue en proceso</div>';

}

function loading(title,messages){

  const list=Array.isArray(messages)&&messages.length?messages:['CONSULTANDO LA COMUNIDAD'];

  setApp(

    '<div class="title"><span class="prompt">&gt;</span> '+esc(title)+'</div>'+

    '<div class="status" id="globalWaitStatus">'+waitMarkup(list[0],0)+'</div>'

  );

}

function startWait(targetId,title,messages){

  const list=Array.isArray(messages)&&messages.length?messages:['PROCESANDO'];

  let index=0;

  const started=Date.now();

  const target=targetId?document.getElementById(targetId):null;

  let statusBox=target;

  if(targetId && !statusBox) return function(){};

  if(targetId){

    statusBox.innerHTML='<div class="status">'+waitMarkup(list[0],0)+'</div>';

  }

  function paint(){

    const elapsed=(Date.now()-started)/1000;

    index=(index+1)%list.length;

    if(targetId){

      const box=document.getElementById(targetId);

      if(box)box.innerHTML='<div class="status">'+waitMarkup(list[index],elapsed)+'</div>';

    }else{

      const box=document.getElementById('globalWaitStatus');

      if(box)box.innerHTML=waitMarkup(list[index],elapsed);

    }

  }

  const timer=setInterval(paint,WAIT_ROTATE_MS);

  return function(){clearInterval(timer);};

}

function error(msg){

  actionBusy=false;

  setApp(

    '<div class="title"><span class="prompt">&gt;</span> CONEXIÓN TEMPORALMENTE NO DISPONIBLE</div>'+

    '<div class="status error">'+esc(msg)+'</div>'+

    '<button class="secondary" id="backBtn">BACK</button>'

  );

  const back=document.getElementById('backBtn');

  if(back)back.onclick=home;

}

function apiCall(fn,args,waitOptions){

  return new Promise(function(resolve,reject){

    const perfStart=performance.now();

    const callbackName='meCb_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);

    console.log('[ME PERF] START',fn,Math.round(perfStart));

    const script=document.createElement('script');

    let finished=false;

    const wait=waitOptions||{};

    const stopWait=wait.silent?function(){}:startWait(wait.targetId||null,wait.title||'PROCESSING',wait.messages||[]);

    let softTimer=setTimeout(function(){
      if(finished||wait.silent)return;
      const elapsed=Math.floor((Date.now()-perfStart)/1000);
      const box=wait.targetId?document.getElementById(wait.targetId):document.getElementById('globalWaitStatus');
      if(box){
        const markup=waitMarkup('SEGUIMOS TRABAJANDO',elapsed);
        box.innerHTML=wait.targetId?'<div class="status warning">'+markup+'</div>':markup;
      }
    },WAIT_LONG_MS);
    const timer=setTimeout(function(){finish(new Error('TIMEOUT_FINAL'));},API_TIMEOUT_MS);

    function cleanup(){

      clearTimeout(timer);

      stopWait();

      try{delete window[callbackName];}catch(e){window[callbackName]=undefined;}

      if(script.parentNode)script.parentNode.removeChild(script);

    }

    function finish(err,result){

      if(finished)return;

      console.log('[ME PERF] FINISH',fn,err?'ERROR':'OK',Math.round(performance.now()-perfStart)+' ms');

      finished=true;

      cleanup();

      if(err)reject(err); else resolve(result);

    }

    window[callbackName]=function(result){

      console.log('[ME PERF] CALLBACK',fn,Math.round(performance.now()-perfStart)+' ms');

      finish(null,result);

    };

    script.onload=function(){

      console.log('[ME PERF] SCRIPT LOAD',fn,Math.round(performance.now()-perfStart)+' ms');

    };

    script.onerror=function(e){

      console.error('[ME PERF] SCRIPT ERROR',fn,Math.round(performance.now()-perfStart)+' ms',e);

      finish(new Error('No pudimos completar la conexión con el sistema. Por favor, inténtalo nuevamente.'));

    };

    const params=new URLSearchParams();

    params.set('api','1');

    params.set('fn',fn);

    params.set('callback',callbackName);

    params.set('args',JSON.stringify(Array.isArray(args)?args:[]));

    params.set('_',String(Date.now()));

    script.async=true;

    script.src=API_URL+'?'+params.toString();

    console.log('[ME PERF] SENT',fn,new Date().toISOString());

    document.head.appendChild(script);

    console.log('[ME PERF] APPENDED',fn,Math.round(performance.now()-perfStart)+' ms');

  });

}

async function callLatest(fn,args,seq,waitOptions){

  const result=await apiCall(fn,args,waitOptions);

  if(seq!==requestSeq)throw new Error('REQUEST_SUPERSEDED');

  return result;

}

function updateWhatsAppSupport_(stage){
  const link=document.getElementById('whatsappSupport');
  if(!link)return;
  let message='Hola, necesito ayuda con mi acceso a Miércoles Electrónicos — Sesión 75.';
  if(stage==='rut')message='Hola, necesito ayuda para consultar mi RUT en Miércoles Electrónicos — Sesión 75.';
  else if(stage==='email')message='Hola, necesito ayuda con la verificación de mi correo para Miércoles Electrónicos — Sesión 75.';
  else if(stage==='code')message='Hola, necesito ayuda con mi código de verificación de Miércoles Electrónicos — Sesión 75.';
  else if(stage==='profile')message='Hola, necesito ayuda para completar mi ficha de Miércoles Electrónicos — Sesión 75.';
  else if(stage==='checkin')message='Hola, necesito ayuda para confirmar mi check-in de Miércoles Electrónicos — Sesión 75.';
  else if(stage==='request')message='Hola, necesito ayuda para completar mi solicitud de acceso a Miércoles Electrónicos — Sesión 75.';
  link.href='https://wa.me/56990915484?text='+encodeURIComponent(message);
}

function home(){
  updateWhatsAppSupport_('rut');

  actionBusy=false;

  setApp(

    '<div class="title"><span class="prompt">&gt;</span> COMMUNITY ACCESS</div>'+

    '<div class="description">Tu recarga de buena música a media semana comienza aquí!<br><br>Ingresa tu RUT para continuar:</div>'+

    '<label>RUT</label>'+

    '<input id="rutInput" type="text" inputmode="text" autocapitalize="none" autocomplete="off" placeholder="17394729-k">'+

    '<button id="go">ENTRAR A LA SESIÓN</button>'+

    '<div class="small">Tu RUT es el identificador único en la comunidad miercoleselectronicos.com.</div>'

  );

  const go=document.getElementById('go');

  const input=document.getElementById('rutInput');

  if(go)go.onclick=consult;

  if(input){

    input.addEventListener('keydown',function(e){if(e.key==='Enter')consult();});

    setTimeout(function(){input.focus();},30);

  }

}

function renderConditions(list){

  if(!Array.isArray(list)||!list.length)return '';

  return '<div class="tramos">'+list.map(function(t){

    return '<div class="tramo"><span>'+esc(t.desde)+' — '+esc(t.hasta)+'</span><strong>'+money(t.valor)+'</strong></div>';

  }).join('')+'</div>';

}

function renderReference(data,action){

  const refs=Array.isArray(data.referencias)?data.referencias:[];

  return '<label>¿A QUIÉN VAS A ESCUCHAR PRINCIPALMENTE O POR QUIÉN FUISTE INVITADO? (OBLIGATORIO)</label>'+

    '<select id="ref"><option value="">SELECCIONA UNA OPCIÓN</option>'+refs.map(function(r){

      return '<option value="'+esc(r)+'">'+esc(r)+'</option>';

    }).join('')+'</select>'+

    '<div id="otroBox" style="display:none"><label>¿QUIÉN?</label><input id="otro" type="text" placeholder="Escribe el nombre"></div>'+

    '<div id="actionStatus"></div>'+

    '<button id="actionBtn">'+(action==='reserve'?'FINALIZAR MI CHECKIN':'CONFIRMAR SOLICITUD')+'</button>';

}

function renderCheckinSummary(data){

  return '<div class="description"><strong>'+esc((data.nombre||'')+' '+(data.apellido||''))+'</strong></div>'+

    '<div class="description">ESTADO: <strong>MIEMBRO</strong></div>';

}

function sendCheckinEmailInBackground_(rut,email){
  if(!rut||!email)return;
  try{
    apiCall(
      'enviarConfirmacionCheckin',
      [rut,email],
      {
        title:'SENDING CONFIRMATION',
        messages:[
          'PREPARING YOUR CONFIRMATION EMAIL',
          'SENDING YOUR CHECK-IN EMAIL',
          'CONFIRMING YOUR EMAIL DELIVERY',
          'ALMOST THERE'
        ]
      }
    ).then(function(r){
      console.log('[ME EMAIL] CONFIRMATION',r&&r.ok?'OK':'ERROR',r||null);
    }).catch(function(e){
      console.warn('[ME EMAIL] CONFIRMATION FAILED',e&&e.message?e.message:e);
    });
  }catch(e){
    console.warn('[ME EMAIL] CONFIRMATION EXCEPTION',e);
  }
}

function bindReference(data,action){

  const ref=document.getElementById('ref');

  const btn=document.getElementById('actionBtn');

  const otherBox=document.getElementById('otroBox');

  if(!ref||!btn)return;

  btn.disabled=!ref.value;

  ref.onchange=function(){

    if(otherBox)otherBox.style.display=this.value==='OTRO'?'block':'none';

    btn.disabled=!this.value;

  };

  btn.onclick=async function(){

    if(actionBusy)return;

    const referencia=ref.value;

    const otro=document.getElementById('otro')?document.getElementById('otro').value.trim():'';

    if(!referencia)return error('DEBES SELECCIONAR UNA REFERENCIA.');

    if(referencia==='OTRO'&&!otro)return error('DEBES INDICAR QUIÉN.');

    actionBusy=true;

    btn.disabled=true;

    btn.innerHTML=action==='reserve'?'GUARDANDO<span class="processingDots"></span>':'GUARDANDO<span class="processingDots"></span>';

    try{

      let r;

      if(action==='reserve'){

        r=await apiCall('crearReserva',[currentRut,currentEmail,referencia,otro],{targetId:'actionStatus',title:'CONFIRMING CHECKIN',messages:['REGISTERING YOUR CHECKIN','SAVING YOUR SESSION 75 ACCESS','CONFIRMING YOUR RESERVATION','ALMOST THERE']});

      }else if(action==='newRequest'){

        const p=data.perfil||{};

        const profileData={

          documento:currentRut,

          email:currentEmail,

          nombre:p.nombre||data.nombre||'',

          apellido:p.apellido||data.apellido||'',

          fechaNacimiento:p.fechaNacimiento||data.fechaNacimiento||'',

          sexo:p.sexo||data.sexo||'',

          instagram:p.instagram||data.instagram||'',

          telefono:p.telefono||data.telefono||''

        };

        r=await apiCall('solicitarAccesoNuevo',[profileData,referencia,otro],{targetId:'actionStatus',title:'SENDING REQUEST',messages:['PREPARING YOUR ACCESS REQUEST','SAVING YOUR REQUEST','CONFIRMING THE INFORMATION','ALMOST THERE']});

      }else{

        r=await apiCall('solicitarAcceso',[currentRut,currentEmail,referencia,otro],{targetId:'actionStatus',title:'SENDING REQUEST',messages:['PREPARING YOUR ACCESS REQUEST','SAVING YOUR REQUEST','CONFIRMING THE INFORMATION','ALMOST THERE']});

      }

      if(!r||!r.ok){

        actionBusy=false;

        return error(r&&r.mensaje?r.mensaje:'NO SE PUDO GUARDAR.');

      }


      // No lanzamos un segundo request oculto después del check-in.
      // Esto evita dejar una ejecución concurrente de Sheets/Brevo consumiendo
      // recursos mientras el usuario ya recibió la confirmación.

      actionBusy=false;

      if(action==='reserve'){

        setApp(

          '<div class="title"><span class="prompt">&gt;</span> ACCESS CONFIRMED</div>'+

          renderCheckinSummary(data)+

          '<div class="status">TU CHECKIN PARA LA SESIÓN '+SESSION+' · SESION '+SESSION+' YA ESTÁ CONFIRMADO.</div>'+

          renderConditions(data.condiciones)+

          '<div class="description"><strong>Para validar tu ingreso en la sesión solo necesitas presentar tu carnet de identidad.</strong></div>'+

          '<div class="description">Con tu RUT puedes consultar siempre el estado de tu CHECKIN en <strong>www.miercoleselectronicos.com</strong>.</div>'+

          '<button class="secondary" id="backBtn">BACK</button>'

        );

      }else{

        setApp(

          '<div class="title"><span class="prompt">&gt;</span> REQUEST RECEIVED</div>'+

          '<div class="status">¡Tu solicitud fue enviada correctamente!</div>'+

          '<div class="description">La respuesta será enviada a tu correo electrónico o puedes consultar nuevamente el estado usando tu RUT.</div>'+

          '<button class="secondary" id="backBtn">BACK</button>'

        );

      }

      const back=document.getElementById('backBtn');

      if(back)back.onclick=home;

      // En reservas de miembro, el correo se dispara después de confirmar
      // visualmente el check-in, sin bloquear la respuesta principal.
      if(action==='reserve'){
        sendCheckinEmailInBackground_(currentRut,currentEmail);
      }

    }catch(e){

      actionBusy=false;

      error(e&&e.message?e.message:'NO SE PUDO GUARDAR.');

    }

  };

}

function renderPendingRequest(res){

  const blacklisted=!!res.listaNegra;

  const status=blacklisted

    ? 'TU SOLICITUD FUE RECIBIDA Y EL RUT ESTÁ MARCADO EN LISTA NEGRA.'

    : (res.solicitudEstado==='PENDIENTE'

      ? 'TU SOLICITUD PARA LA SESIÓN '+SESSION+' YA FUE RECIBIDA Y ESTÁ PENDIENTE DE APROBACIÓN.'

      : 'TU SOLICITUD PARA LA SESIÓN '+SESSION+' YA FUE PROCESADA.');

  setApp(

    '<div class="title"><span class="prompt">&gt;</span> REQUEST STATUS</div>'+

    '<div class="description"><strong>'+esc((res.nombre||'')+' '+(res.apellido||''))+'</strong></div>'+

    (res.validadoAnteriormente?'<div class="description">ESTADO: <strong>MIEMBRO</strong></div>':'')+

    '<div class="status">'+esc(status)+'</div>'+

    '<div class="description">Con tu RUT puedes consultar siempre el estado de tu solicitud en <strong>www.miercoleselectronicos.com</strong>.</div>'+

    '<button class="secondary" id="backBtn">BACK</button>'

  );

  document.getElementById('backBtn').onclick=home;

}

function renderExisting(res){
  updateWhatsAppSupport_('checkin');

  if(res.reservaActual){

    setApp(

      '<div class="title"><span class="prompt">&gt;</span> ACCESS CONFIRMED</div>'+

      '<div class="description"><strong>'+esc((res.nombre||'')+' '+(res.apellido||''))+'</strong></div>'+ 

      (res.validadoAnteriormente?'<div class="description">ESTADO: <strong>MIEMBRO</strong></div>':'')+

      '<div class="status">TU CHECKIN PARA LA SESIÓN '+SESSION+' · SESION '+SESSION+' YA ESTÁ CONFIRMADO.</div>'+ 

      renderConditions(res.condiciones)+

      '<div class="description"><strong>Para validar tu ingreso en la sesión solo necesitas presentar tu carnet de identidad.</strong></div>'+ 

      '<div class="description">Con tu RUT puedes consultar siempre el estado de tu CHECKIN en <strong>www.miercoleselectronicos.com</strong>.</div>'+ 

      '<button class="secondary" id="backBtn">BACK</button>'

    );

    document.getElementById('backBtn').onclick=home;

    return;

  }

  if(res.validadoAnteriormente){

    const data=Object.assign({},res,{sesion:SESSION,miembroAnteriormente:true});

    setApp(

      '<div class="title"><span class="prompt">&gt;</span> CHECKIN</div>'+ 

      renderCheckinSummary(data)+

      '<div class="status">Tu checkin para la sesión <strong>'+SESSION+'</strong> está listo para ser confirmado!</div>'+ 

      renderReference(data,'reserve')

    );

    bindReference(data,'reserve');

    return;

  }

  setApp(

    '<div class="title"><span class="prompt">&gt;</span> REQUEST READY</div>'+ 

    '<div class="description"><strong>'+esc((res.nombre||'')+' '+(res.apellido||''))+'</strong></div>'+ 

    '<div class="description">TU FICHA YA ESTÁ REGISTRADA EN NUESTRA COMUNIDAD.</div>'+ 

    '<div class="description">NO TIENES UNA SOLICITUD PARA ESTA SESIÓN.</div>'+ 

    '<div class="description">COMPLETA ESTE ÚLTIMO PASO PARA ENVIAR TU SOLICITUD DE ACCESO.</div>'+ 

    renderReference(res,'newRequest')

  );

  bindReference(res,'newRequest');

}

function renderNewUserProfile(rut,refs){
  updateWhatsAppSupport_('email');

  currentRut=rut;

  setApp(

    '<div class="title"><span class="prompt">&gt;</span> VERIFY EMAIL</div>'+ 

    '<div class="description">Este RUT todavía no existe en nuestra comunidad.</div>'+ 

    '<div class="description">Ingresa tu correo para verificar que pertenece a ti. Te enviaremos un código antes de completar tu ficha.</div>'+ 

    '<label>EMAIL</label><input id="newEmail" type="email" inputmode="email" autocomplete="email" placeholder="tu@email.com">'+ 

    '<div id="newUserEmailStatus"></div>'+ 

    '<button id="sendEmailBtn">ENVIAR CÓDIGO</button>'+ 

    '<button class="secondary" id="backBtn">BACK</button>'

  );

  document.getElementById('backBtn').onclick=home;

  const emailInput=document.getElementById('newEmail');

  const btn=document.getElementById('sendEmailBtn');

  emailInput.focus();

  emailInput.onkeydown=function(e){if(e.key==='Enter')btn.click();};

  btn.onclick=async function(){

    if(actionBusy)return;

    const email=emailInput.value.trim().toLowerCase();

    if(!email||email.indexOf('@')<1){showInlineNewUserError('DEBES INGRESAR UN CORREO VÁLIDO.');return;}

    actionBusy=true;

    btn.disabled=true;

    btn.textContent='CONSULTANDO...';

    try{

      const member=await apiCall('consultarEmail',[email],{targetId:'newUserEmailStatus',title:'VERIFYING EMAIL',messages:['CHECKING YOUR EMAIL','VERIFYING COMMUNITY RECORDS','MAKING SURE EVERYTHING MATCHES','ALMOST THERE']});

      if(!member||!member.ok)throw new Error('NO SE PUDO CONSULTAR LA COMUNIDAD.');

      if(member.existe&&member.tieneRut){

        actionBusy=false;

        return showInlineNewUserError(

          member.rut!==currentRut

            ? 'ESTE CORREO YA ESTÁ ASOCIADO A OTRO RUT.'

            : 'ESTE CORREO YA ESTÁ REGISTRADO PARA ESTE RUT. INGRESA NUEVAMENTE EL RUT PARA CONTINUAR.'

        );

      }

      // Se conserva esta validación de solicitudes por correo como barrera de

      // consistencia para registros que aún no existen en COMUNIDAD.

      const existingRequest=await apiCall('consultarCorreoAntesDeVerificar',[email,currentRut],{targetId:'newUserEmailStatus',title:'CHECKING REQUESTS',messages:['CHECKING PREVIOUS REQUESTS','VERIFYING SESSION 75 STATUS','CHECKING YOUR ACCESS RECORD','ALMOST THERE']});

      if(!existingRequest||!existingRequest.ok)throw new Error(existingRequest&&existingRequest.mensaje?existingRequest.mensaje:'NO SE PUDO CONSULTAR LAS SOLICITUDES.');

      if(existingRequest.solicitudExiste){

        actionBusy=false;

        setApp(

          '<div class="title"><span class="prompt">&gt;</span> REQUEST STATUS</div>'+

          '<div class="status">TU SOLICITUD PARA LA SESIÓN '+SESSION+' YA FUE RECIBIDA Y ESTÁ PENDIENTE DE APROBACIÓN.</div>'+ 

          '<div class="description">Con tu RUT puedes consultar siempre el estado de tu solicitud en <strong>www.miercoleselectronicos.com</strong>.</div>'+ 

          '<button class="secondary" id="backBtn">BACK</button>'

        );

        document.getElementById('backBtn').onclick=home;

        return;

      }

      currentEmail=email;

      btn.textContent='ENVIANDO...';

      const sent=await apiCall('enviarCodigo',[email],{targetId:'newUserEmailStatus',title:'SENDING CODE',messages:['PREPARING YOUR VERIFICATION CODE','SENDING THE CODE TO YOUR EMAIL','WAITING FOR THE EMAIL SERVICE','ALMOST THERE']});

      if(!sent||!sent.ok)throw new Error(sent&&sent.mensaje?sent.mensaje:'NO SE PUDO ENVIAR EL CÓDIGO.');

      actionBusy=false;

      renderVerifyCode(refs,!!member.validadoAlgunaVez);

    }catch(e){

      actionBusy=false;

      showInlineNewUserError(e&&e.message?e.message:'NO SE PUDO VERIFICAR EL CORREO.');

    }

  };

}

function showInlineNewUserError(message){

  const box=document.getElementById('newUserEmailStatus');

  if(box)box.innerHTML='<div class="status error">'+esc(message)+'</div>';

  const btn=document.getElementById('sendEmailBtn');

  if(btn){btn.disabled=false;btn.textContent='ENVIAR CÓDIGO';}

}

function renderVerifyCode(refs,validadoAnteriormente){
  updateWhatsAppSupport_('code');

  setApp(

    '<div class="title"><span class="prompt">&gt;</span> VERIFY EMAIL</div>'+ 

    '<div class="description">Enviamos un código a <strong>'+esc(currentEmail)+'</strong>.</div>'+ 

    '<label>CÓDIGO DE VERIFICACIÓN</label>'+ 

    '<input id="emailCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">'+

    '<div id="verifyStatus"></div>'+ 

    '<button id="verifyCodeBtn">VERIFICAR CORREO</button>'+ 

    '<button class="secondary" id="backBtn">BACK</button>'

  );

  const input=document.getElementById('emailCode');

  const btn=document.getElementById('verifyCodeBtn');

  document.getElementById('backBtn').onclick=home;

  input.oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,6);};

  input.onkeydown=function(e){if(e.key==='Enter')btn.click();};

  setTimeout(function(){input.focus();},30);

  btn.onclick=async function(){

    if(actionBusy)return;

    const code=input.value.replace(/\D/g,'').slice(0,6);

    if(code.length!==6){error('INGRESA EL CÓDIGO DE 6 DÍGITOS.');return;}

    actionBusy=true;

    btn.disabled=true;

    btn.textContent='VALIDANDO...';

    try{

      const r=await apiCall('verificarCodigo',[currentEmail,code],{targetId:'verifyStatus',title:'VALIDATING CODE',messages:['CHECKING THE CODE','VERIFYING EMAIL OWNERSHIP','CONFIRMING YOUR ACCESS','ALMOST THERE']});

      if(!r||!r.ok)throw new Error(r&&r.mensaje?r.mensaje:'CÓDIGO INCORRECTO O EXPIRADO.');

      actionBusy=false;

      // No segunda consulta a COMUNIDAD: consultarEmail() ya entregó

      // validadoAlgunaVez antes de enviar el código.

      renderAssistantProfile(currentEmail,refs,!!validadoAnteriormente);

    }catch(e){

      actionBusy=false;

      error(e&&e.message?e.message:'CÓDIGO INCORRECTO O EXPIRADO.');

    }

  };

}

function renderAssistantProfile(email,refs,validadoAnteriormente){
  updateWhatsAppSupport_('profile');

  setApp(

    '<div class="title"><span class="prompt">&gt;</span> ASSISTANT PROFILE</div>'+ 

    '<div class="status">CORREO VERIFICADO CORRECTAMENTE.</div>'+ 

    '<div class="description">'+(validadoAnteriormente

      ? 'Genial! Ya has sido parte de nuestras sesiones anteriormente. Ahora ayúdanos completando tu ficha una sola vez, para que en el futuro solo uses tu RUT de manera simple y directa.'

      : 'Ahora completa tu ficha de asistente.')+'</div>'+ 

    '<label>EMAIL VERIFICADO</label><input id="newEmailVerified" type="email" value="'+esc(email)+'" readonly>'+ 

    '<label>NOMBRE</label><input id="newNombre" type="text" autocomplete="given-name" placeholder="Nombre">'+ 

    '<label>APELLIDO</label><input id="newApellido" type="text" autocomplete="family-name" placeholder="Apellido">'+ 

    '<label>FECHA DE NACIMIENTO</label><input id="newNacimiento" type="date" aria-label="Fecha de nacimiento">'+ 

    '<label>SEXO</label><select id="newSexo" aria-label="Sexo"><option value="">SELECCIONA UNA OPCIÓN</option><option value="HOMBRE">HOMBRE</option><option value="MUJER">MUJER</option><option value="OTRO">OTRO</option></select>'+ 

    '<label>INSTAGRAM</label><input id="newInstagram" type="text" autocomplete="off" placeholder="@tuinstagram">'+ 

    '<label>TELÉFONO</label><input id="newTelefono" type="tel" inputmode="tel" autocomplete="tel" placeholder="+56968374826">'+ 

    '<div id="profileStatus"></div>'+ 

    '<button id="saveProfileBtn">CONTINUAR</button>'+ 

    '<button class="secondary" id="backBtn">BACK</button>'

  );

  document.getElementById('backBtn').onclick=home;

  const saveBtn=document.getElementById('saveProfileBtn');

  saveBtn.onclick=async function(){

    if(actionBusy)return;

    const datos={

      documento:currentRut,

      email:email,

      nombre:document.getElementById('newNombre').value.trim(),

      apellido:document.getElementById('newApellido').value.trim(),

      fechaNacimiento:document.getElementById('newNacimiento').value,

      sexo:document.getElementById('newSexo').value,

      instagram:document.getElementById('newInstagram').value.trim(),

      telefono:document.getElementById('newTelefono').value.trim()

    };

    if(!datos.nombre||!datos.apellido||!datos.fechaNacimiento||!datos.sexo||!datos.instagram||!datos.telefono){

      const box=document.getElementById('profileStatus');

      box.innerHTML='<div class="status error">DEBES COMPLETAR TODA LA FICHA DE ASISTENTE.</div>';

      return;

    }

    actionBusy=true;

    saveBtn.disabled=true;

    saveBtn.textContent='GUARDANDO FICHA...';

    try{

      const saved=await apiCall('saveNewProfile',[datos],{targetId:'profileStatus',title:'SAVING PROFILE',messages:['SAVING YOUR COMMUNITY PROFILE','CHECKING YOUR INFORMATION','SECURING YOUR RECORD','ALMOST THERE']});

      if(!saved||!saved.ok)throw new Error(saved&&saved.mensaje?saved.mensaje:'NO SE PUDO GUARDAR LA FICHA.');

      actionBusy=false;

      const data={

        ok:true,

        sesion:SESSION,

        existe:true,

        rut:currentRut,

        email:email,

        nombre:datos.nombre,

        apellido:datos.apellido,

        estado:saved.estado||(validadoAnteriormente?'MIEMBRO':'NUEVO'),

        condicion:saved.condicion||(validadoAnteriormente?'MIEMBRO':'NUEVO'),

        condiciones:Array.isArray(saved.condiciones)?saved.condiciones:[],

        referencias:Array.isArray(saved.referencias)?saved.referencias:refs,

        reservaActual:false,

        validadoAnteriormente:!!validadoAnteriormente,

        aprobadoAutomaticamente:!!saved.aprobadoAutomaticamente,

        perfil:saved.perfil||datos

      };

      if(saved.aprobadoAutomaticamente){

        setApp(

          '<div class="title"><span class="prompt">&gt;</span> CHECKIN</div>'+ 

          renderCheckinSummary(data)+

          '<div class="status">Tu checkin para la sesión <strong>'+SESSION+'</strong> está listo para ser confirmado!</div>'+ 

          renderReference(data,'reserve')

        );

        bindReference(data,'reserve');

      }else{

        setApp(

          '<div class="title"><span class="prompt">&gt;</span> REQUEST READY</div>'+ 

          '<div class="description">Ya casi estás listo. Completa este último paso para enviar tu solicitud.</div>'+ 

          renderReference(data,'newRequest')

        );

        bindReference(data,'newRequest');

      }

    }catch(e){

      actionBusy=false;

      const box=document.getElementById('profileStatus');

      const msg=e&&e.message==='TIMEOUT_FINAL'?'EL SISTEMA ESTÁ TOMANDO MÁS TIEMPO DE LO HABITUAL. LA FICHA PUEDE SEGUIR PROCESÁNDOSE. ESPERA UNOS SEGUNDOS ANTES DE VOLVER A INTENTAR.':(e&&e.message?e.message:'NO SE PUDO GUARDAR LA FICHA.');

      if(box)box.innerHTML='<div class="status error">'+esc(msg)+'</div>';

      saveBtn.disabled=false;

      saveBtn.textContent='CONTINUAR';

    }

  };

}

async function consult(){

  if(actionBusy)return;

  const input=document.getElementById('rutInput');

  const value=input?input.value.trim():'';

  if(!value)return error('DEBES INGRESAR TU RUT.');

  if(!validRutFront_(value)){

    showRutValidationError();

    return;

  }

  actionBusy=true;

  const seq=++requestSeq;

  try{

    loading('SEARCHING...',['CHECKING COMMUNITY HISTORY','CONNECTING WITH THE COMMUNITY','RETRIEVING YOUR SESSION STATUS','ALMOST THERE']);

    const res=await callLatest('consultarRut',[value],seq,{

      title:'SEARCHING',

      messages:['CHECKING COMMUNITY HISTORY','CONNECTING WITH THE COMMUNITY','RETRIEVING YOUR SESSION STATUS','ALMOST THERE']

    });

    actionBusy=false;

    if(!res||!res.ok)return error(res&&res.mensaje?res.mensaje:'NO SE PUDO CONSULTAR EL RUT.');

    currentRut=res.rut||'';

    currentEmail=res.email||'';

    currentData=res;

    // Exact decision tree of the current Apps Script backend:

    // reservation -> confirmed; prior validation -> direct check-in;

    // existing pending request -> status; no community record -> profile;

    // existing non-validated member -> new request.

    if(res.reservaActual)return renderExisting(res);

    if(res.solicitudExiste&&!res.validadoAnteriormente)return renderPendingRequest(res);

    if(!res.existe)return renderNewUserProfile(res.rut,res.referencias||[]);

    if(res.validadoAnteriormente)return renderExisting(res);

    renderExisting(res);

  }catch(e){

    if(e&&e.message==='REQUEST_SUPERSEDED')return;

    actionBusy=false;

    error(e&&e.message==='TIMEOUT_FINAL'?'EL SISTEMA ESTÁ TOMANDO MÁS TIEMPO DE LO HABITUAL. LA CONSULTA PUEDE SEGUIR PROCESÁNDOSE. ESPERA UNOS SEGUNDOS ANTES DE VOLVER A INTENTAR.':(e&&e.message?e.message:'NO SE PUDO CONSULTAR EL RUT.'));

  }

}

home();

</script>
