<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="me-logo.png" type="image/png">
  <title>Miércoles Electrónicos</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #050505;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body { min-height: 100vh; }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 32px 14px 24px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .brandLogo {
      display: block;
      width: 300px;
      max-width: 82%;
      height: auto;
      margin: 0 0 12px;
    }

    .session {
      font-family: monospace;
      color: #666666;
      font-size: 11px;
      letter-spacing: 1.5px;
    }

    .line {
      height: 1px;
      background: #242424;
      margin: 30px 0;
    }

    .title {
      font-family: monospace;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .prompt {
      color: #ff1638;
      margin-right: 7px;
    }

    .description {
      color: #bdbdbd;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .label {
      display: block;
      font-family: monospace;
      color: #777777;
      font-size: 11px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .rut {
      display: block;
      width: 100%;
      max-width: 430px;
      height: 58px;
      border: 1px solid #333333;
      background: #050505;
      color: #ffffff;
      padding: 0 16px;
      font-family: monospace;
      font-size: 17px;
      outline: none;
      margin-bottom: 14px;
    }

    .rut:focus {
      border-color: #ff1638;
    }

    .button {
      width: 100%;
      max-width: 430px;
      height: 58px;
      border: 0;
      background: #ff1638;
      color: #ffffff;
      font-family: monospace;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .footer {
      margin-top: 70px;
      font-family: monospace;
      color: #454545;
      font-size: 10px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      .page { padding: 28px 14px 22px; }
      .brandLogo { width: 275px; max-width: 92%; }
      .title { font-size: 20px; }
      .description { font-size: 13px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="container">

      <img
        class="brandLogo"
        src="me-logo.png"
        alt="Miércoles Electrónicos"
      >

      <div class="session">
        SESSION_071 // UMHO_MOONWALKER
      </div>

      <div class="line"></div>

      <div class="title">
        <span class="prompt">&gt;</span> COMMUNITY ACCESS
      </div>

      <div class="description">
        Tu recarga de buena música a media semana comienza aquí!
      </div>

      <div class="description">
        Ingresa tu RUT para continuar:
      </div>

      <label class="label" for="rut">RUT</label>

      <input
        id="rut"
        class="rut"
        type="text"
        inputmode="text"
        autocomplete="off"
        placeholder="12.345.678-9"
      >

      <button
        class="button"
        type="button"
        onclick="continuar()"
      >
        ENTRAR A LA SESIÓN
      </button>

      <div class="footer">
        COMMUNITY SYSTEM // 2026<br>
        SESSION_071 // ACCESS CONTROL
      </div>

    </div>
  </main>

  <script>
    function continuar() {
      const rut = document.getElementById('rut').value.trim();

      if (!rut) {
        alert('DEBES INGRESAR TU RUT.');
        return;
      }

      alert('OK — INTERFAZ FUNCIONANDO.');
    }
  </script>
</body>
</html>
