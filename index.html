<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="favicon.png"> 
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Miércoles Electrónicos</title>
<style>
:root{--bg:#050505;--text:#f2f2f2;--muted:#666;--line:#222;--red:#ff1d38;--green:#00ff66;--yellow:#ffd60a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:monospace}
body{padding:0 20px}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:38px 0 90px;position:relative}
.system{color:var(--muted);font-size:10px;letter-spacing:1.5px;margin-bottom:22px}
.logo{display:block;width:290px;max-width:100%;height:auto;margin:0}
.session{margin-top:14px;color:var(--muted);font-size:10px;letter-spacing:1px}
.line{height:1px;background:var(--line);margin:30px 0}
.title{font-size:17px;margin-bottom:14px}
.prompt{color:var(--red)}
.description{font-size:12px;color:#aaa;line-height:1.7;margin:10px 0}
label{display:block;margin:20px 0 8px;color:var(--muted);font-size:10px;letter-spacing:1.5px}
input,select{width:100%;padding:15px;background:#000;color:#fff;border:1px solid #292929;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--green)}
button{width:100%;margin-top:18px;padding:16px;background:var(--red);color:#fff;border:0;font:inherit;font-weight:700;cursor:pointer}
button.secondary{background:#000;color:#fff;border:1px solid #fff}
button:disabled{opacity:.5;cursor:wait}
#rutInput{width:290px;max-width:100%}
.status{margin:20px 0;padding:16px;border-left:2px solid var(--green);background:#080d09;font-size:12px;line-height:1.7}
.error{border-left-color:var(--red);background:#0d0707}
.warning{border-left-color:var(--yellow);background:#0d0c07}
.tramos{border:1px solid var(--line);margin:20px 0}
.tramo{display:flex;justify-content:space-between;gap:15px;padding:12px;border-bottom:1px solid #161616;font-size:11px}
.tramo:last-child{border:0}
.data{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:20px 0}
.row{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid #151515;font-size:11px}
.row:last-child{border:0}
.key{color:#666}
.value{text-align:right}
.footer{margin-top:48px;color:#444;font-size:9px;line-height:1.8}
.small{margin-top:14px;color:#666;font-size:9px;line-height:1.7}

.heartMark{position:fixed;right:24px;bottom:22px;width:54px;height:auto;z-index:20;opacity:.95;pointer-events:none}
.heartMark img{display:block;width:100%;height:auto}
@media(max-width:600px){
 body{padding:0 14px}
 .wrap{width:90vw;padding:24px 0 90px}
 .logo{width:min(100%,340px)}
 .session{font-size:12px}
 .title{font-size:20px;line-height:1.3}
 .description,.status{font-size:14px;line-height:1.65}
 label{font-size:11px}
 input,select,button{min-height:54px;padding:15px;font-size:16px}
 .tramo{font-size:13px;padding:14px 12px}
}

.closing{padding:28px 0 10px}.closing-main{font-size:22px;line-height:1.45;margin:22px 0 28px;letter-spacing:.3px}.closing-main strong{color:#fff}.closing-next{font-size:15px;line-height:1.7;color:#aaa}.closing-next strong{color:#fff}.instagram{display:block;width:100%;margin-top:32px;padding:17px;text-align:center;text-decoration:none;background:var(--red);color:#fff;font:inherit;font-weight:700}.instagram:hover{opacity:.9}@media(max-width:600px){.closing{padding:24px 0 10px}.closing-main{font-size:20px;line-height:1.5}.closing-next{font-size:14px}}
</style>
</head>
